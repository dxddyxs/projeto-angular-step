<h2>Lista de Usuários</h2>
<ul>
    @for (usuario of usuarios; track usuario.id) {
    <li>
        <strong>{{ usuario.nome | uppercase }}</strong> - {{ usuario.email }} - Salário: {{ usuario.salario |
        currency:'BRL' }}
    </li>
    } @empty {
    <li>Nenhum usuário encontrado</li>
    }
</ul>
